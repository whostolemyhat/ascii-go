{{ define "body" }}
<h1>AsciiGo</h1>

<form action="/convert" enctype="multipart/form-data" method="post" id="convert">
  <label for="file">Pick an image <input type="file" name="img" id="img" accept=".png,.jpg"></label>
  <button>Convert</button>
</form>

<h2>What is this?</h2>
<p>Convert an image into ascii art. Basic version of asciipicture.com but with a Go backend.</p>

<pre id="output"></pre>

<script src="/static/main.js"></script>
{{end}}
